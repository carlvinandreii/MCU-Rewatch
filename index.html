<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCU Rewatch Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      @font-face {
        font-family: "Avengeance";
        src: url("fonts/avengeance.ttf") format("truetype");
      }
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 25px;
        font-size: 14px;
        overflow-x: hidden;
      }
      /* --- INTRO E VIDEO --- */
      #intro-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(rgba(15, 23, 42, 0.9), rgba(0, 0, 0, 0.95));
        z-index: 9999;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition: opacity 1s ease;
      }
      #intro-logo {
        max-width: 420px;
        margin-bottom: 35px;
        filter: drop-shadow(0 0 20px rgba(226, 54, 54, 0.6));
      }
      #start-btn {
        background-color: #e23636;
        color: white;
        font-family: "Avengeance", sans-serif;
        font-size: 1.8em;
        padding: 15px 35px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        letter-spacing: 2px;
        box-shadow: 0 0 20px rgba(226, 54, 54, 0.6);
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      #start-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 0 30px rgba(226, 54, 54, 0.9);
      }
      #intro-social {
        position: absolute;
        bottom: 30px;
        opacity: 0.8;
      }
      #intro-social a {
        color: white;
        text-decoration: none;
        font-family: "Inter", sans-serif;
        font-size: 0.95em;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: opacity 0.2s;
      }
      #intro-social a:hover {
        opacity: 1;
      }
      #intro-social img {
        width: 18px;
        height: 18px;
      }
      #intro-video-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #000;
        z-index: 9998;
        display: none;
        opacity: 1;
        transition: opacity 1.5s ease;
      }
      #intro-video {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #skip-btn {
        position: absolute;
        bottom: 30px;
        right: 30px;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        border: 1px solid white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        z-index: 10000;
      }
      /* --- MAIN CONTENT & SCHEDE (TABS) --- */
      .container {
        max-width: 1400px;
        margin: 0 auto;
        opacity: 0;
        transition: opacity 1.5s ease;
      }
      .tabs-container {
        display: flex;
        justify-content: center;
        align-items: flex-end;
        gap: 40px;
        margin-top: 30px;
        margin-bottom: 30px;
      }
      .tab-btn {
        background: transparent;
        border: none;
        color: #64748b;
        cursor: pointer;
        text-align: center;
        transition:
          transform 0.3s,
          filter 0.3s;
        filter: grayscale(100%) opacity(0.5);
      }
      .tab-btn:hover {
        transform: scale(1.05);
        filter: grayscale(50%) opacity(0.8);
      }
      .tab-btn.active {
        filter: grayscale(0%) opacity(1);
        color: #e23636;
      }
      .tab-btn img {
        height: 60px;
        object-fit: contain;
        display: block;
        margin: 0 auto;
        filter: drop-shadow(0px 4px 10px rgba(226, 54, 54, 0.4));
      }
      .tab-btn h1 {
        margin: 0;
        font-size: 1.8em;
        text-transform: uppercase;
        font-family: "Avengeance", sans-serif;
        letter-spacing: 1.5px;
      }
      .view-section {
        display: none;
        animation: fadeIn 0.5s ease;
      }
      .view-section.active {
        display: block;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      /* --- DASHBOARD E LISTE --- */
      .top-dashboard {
        background-color: #1e293b;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid #334155;
        text-align: center;
      }
      .progress-bar {
        background-color: #0f172a;
        border-radius: 10px;
        height: 14px;
        width: 100%;
        margin: 15px 0;
        overflow: hidden;
        border: 1px solid #334155;
      }
      .progress-fill {
        background-color: #e23636;
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 1.1em;
        font-weight: 600;
      }
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(480px, 1fr));
        gap: 20px;
      }
      .category {
        background-color: #1e293b;
        border-radius: 12px;
        padding: 18px 22px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid #334155;
        border-left: 5px solid #e23636;
      }
      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #e23636;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }
      .category-header h2 {
        margin: 0;
        font-size: 1.25em;
        color: #f1f5f9;
      }
      .movie-list {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }
      .movie-list li {
        padding: 7px 0;
        border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      }
      .movie-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      label {
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        flex-grow: 1;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 12px;
        cursor: pointer;
        accent-color: #e23636;
      }
      .checked-text {
        text-decoration: line-through;
        color: #64748b;
      }
      .duration {
        font-size: 0.8em;
        color: #94a3b8;
        margin-left: 10px;
      }
      details {
        margin-top: 8px;
        padding: 8px;
        background: #0f172a;
        border-radius: 6px;
        border: 1px solid #334155;
      }
      summary {
        cursor: pointer;
        font-size: 0.85em;
        color: #e23636;
        font-weight: bold;
      }
      .episodes {
        list-style: none;
        padding: 6px 0 0 15px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }
      .episodes li {
        padding: 3px 0;
        border-bottom: none;
      }
      /* --- BOTTONE AUDIO --- */
      #audio-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        z-index: 10000;
        background-color: #0f172a;
        color: white;
        border: 2px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        width: 45px;
        height: 45px;
        font-size: 1.2em;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      }
      #audio-toggle-btn:hover {
        background-color: #1e293b;
        border-color: #e23636;
        transform: scale(1.05);
      }
      /* --- MOBILE --- */
      @media (max-width: 768px) {
        #intro-video-container video,
        #intro-video {
          width: 100% !important;
          height: auto !important;
          max-height: 80vh;
          object-fit: contain;
        }
        #intro-social {
          position: relative !important;
          bottom: auto !important;
          margin-top: 25px !important;
        }
        #intro-logo {
          max-width: 240px !important;
          margin-bottom: 20px !important;
        }
        #start-btn {
          font-size: 1.3em !important;
          padding: 12px 25px !important;
        }
        .tabs-container {
          flex-direction: column;
          align-items: center;
          gap: 20px;
        }
        .tab-btn img {
          height: 40px;
        }
        .grid-container {
          grid-template-columns: 1fr;
        }
        .episodes {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

    </div>

    <div id="intro-video-container">

        <!-- Bottone 2: Universo Marvel -->
        <button class="tab-btn" id="btn-universe">

          <img
            src="https://upload.wikimedia.org/wikipedia/commons/b/b9/Marvel_Logo.svg"
            alt="Marvel"
            style="max-height: 40px; margin-bottom: 0"
          />
        </button>
      </div>

      <!-- ============================================== -->
      <!-- VISTA 1: MARVEL CINEMATIC UNIVERSE (SOLO MCU) -->
      <!-- ============================================== -->
      <div id="view-mcu" class="view-section active">

          <div class="progress-text">
            Progresso MCU: <span id="progress-percentage">0</span>% (<span
              id="progress-count"
              >0</span
            >
            di <span id="total-count">0</span>)
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
          </div>
          <label style="cursor: pointer; font-weight: 600; color: #e23636"
            ><input
              type="checkbox"
              id="check-all"
              style="margin-right: 8px"
            />Azzera / Seleziona Tutto</label
          >
        </div>

        <div class="grid-container" id="mcu-grid">
          <!-- Popolato dal template tramite JS -->
        </div>
      </div>

      <!-- ============================================== -->
      <!-- VISTA 2: UNIVERSO MARVEL (TUTTO + FOX + SONY)  -->
      <!-- ============================================== -->
      <div id="view-universe" class="view-section">
        <div class="top-dashboard">
          <div class="progress-text">
            Progresso Universo Totale:
            <span id="univ-progress-percentage">0</span>% (<span
              id="univ-progress-count"
              >0</span
            >
            di <span id="univ-total-count">0</span>)
          </div>
          <div class="progress-bar">
            <div class="progress-fill" id="univ-progress-fill"></div>
          </div>
          <label style="cursor: pointer; font-weight: 600; color: #e23636"
            ><input
              type="checkbox"
              id="univ-check-all"
              style="margin-right: 8px"
            />Azzera / Seleziona Tutto</label
          >
        </div>

        <div class="grid-container" id="universe-grid">
          <!-- Popolato dal template tramite JS -->
        </div>
      </div>
    </div>
    <!-- Fine MAIN CONTENT -->

    <script>
      // 1. INIZIALIZZAZIONE DELLE LISTE HTML
      const mcuGrid = document.getElementById("mcu-grid");
      const universeGrid = document.getElementById("universe-grid");
      const mcuData = document.getElementById("mcu-data").innerHTML;
      const foxSonyData = document.getElementById("fox-sony-data").innerHTML;

      // La sezione MCU contiene solo il MCU. La sezione Universo contiene MCU + Fox/Sony.
      mcuGrid.innerHTML = mcuData;

      // Duplichiamo il MCU per la vista universo assegnando ID unici ma collegati
      let clonedMcuData = mcuData.replace(
        /id="([^"]+)"/g,
        'id="$1_u" data-sync="$1"',
      );
      universeGrid.innerHTML = clonedMcuData + foxSonyData;

      // 2. GESTIONE INTRO
      const startBtn = document.getElementById("start-btn");
      const introScreen = document.getElementById("intro-screen");
      const videoContainer = document.getElementById("intro-video-container");
      const introVideo = document.getElementById("intro-video");
      const skipBtn = document.getElementById("skip-btn");
      const mainContent = document.getElementById("main-content");
      const bgMusic = document.getElementById("bg-music");

      function showMainSite() {
        videoContainer.style.opacity = "0";
        setTimeout(() => {
          videoContainer.style.display = "none";
          mainContent.style.opacity = "1";
          bgMusic.volume = 0.5;
          bgMusic.play();
        }, 1500);
      }
      startBtn.addEventListener("click", () => {
        introScreen.style.opacity = "0";
        setTimeout(() => {
          introScreen.style.display = "none";
          videoContainer.style.display = "block";
          introVideo.play();
        }, 1000);
      });
      introVideo.addEventListener("ended", showMainSite);
      skipBtn.addEventListener("click", () => {
        introVideo.pause();
        showMainSite();
      });

      // 3. CAMBIO SCHEDE (MCU vs UNIVERSO)
      const btnMcu = document.getElementById("btn-mcu");
      const btnUniverse = document.getElementById("btn-universe");
      const viewMcu = document.getElementById("view-mcu");
      const viewUniverse = document.getElementById("view-universe");

      btnMcu.addEventListener("click", () => {
        btnMcu.classList.add("active");
        btnUniverse.classList.remove("active");
        viewMcu.classList.add("active");
        viewUniverse.classList.remove("active");
      });
      btnUniverse.addEventListener("click", () => {
        btnUniverse.classList.add("active");
        btnMcu.classList.remove("active");
        viewUniverse.classList.add("active");
        viewMcu.classList.remove("active");
      });

      // 4. GESTIONE PROGRESSO E SINCRONIZZAZIONE
      function getStorageKey(cb) {
        return cb.dataset.sync || cb.id;
      }

      function calcProgress(viewId, fillId, pctId, cntId, totId) {
        let totalItems = 0;
        let checkedCount = 0;
        const view = document.getElementById(viewId);

        view
          .querySelectorAll(".category .movie-list > li:has(.episodes)")
          .forEach((liItem) => {
            const seriesCb = liItem.querySelector(
              ':scope > .movie-item input[type="checkbox"]',
            );
            const episodeCbs = liItem.querySelectorAll(
              '.episodes input[type="checkbox"]',
            );
            const allEpChecked = Array.from(episodeCbs).every(
              (cb) => cb.checked,
            );
            if (seriesCb) seriesCb.checked = allEpChecked;
            if (allEpChecked) {
              if (seriesCb)
                seriesCb.closest("label").classList.add("checked-text");
              checkedCount++;
            } else {
              if (seriesCb)
                seriesCb.closest("label").classList.remove("checked-text");
            }
            totalItems++;
          });

        view
          .querySelectorAll(
            '.category .movie-list > li:not(:has(.episodes)) > .movie-item input[type="checkbox"]',
          )
          .forEach((checkbox) => {
            if (checkbox.checked) {
              checkbox.closest("label").classList.add("checked-text");
              checkedCount++;
            } else {
              checkbox.closest("label").classList.remove("checked-text");
            }
            totalItems++;
          });

        const percentage =
          totalItems === 0 ? 0 : Math.round((checkedCount / totalItems) * 100);
        document.getElementById(fillId).style.width = percentage + "%";
        document.getElementById(pctId).innerText = percentage;
        document.getElementById(cntId).innerText = checkedCount;
        document.getElementById(totId).innerText = totalItems;

        view.querySelectorAll(".category").forEach((categoryDiv) => {
          const phaseCb = categoryDiv.querySelector(".check-phase");
          const phaseItems = categoryDiv.querySelectorAll(
            '.movie-list > li > .movie-item input[type="checkbox"]',
          );
          if (phaseCb && phaseItems.length > 0)
            phaseCb.checked = Array.from(phaseItems).every((cb) => cb.checked);
        });
      }

      function updateAllProgress() {
        calcProgress(
          "view-mcu",
          "progress-fill",
          "progress-percentage",
          "progress-count",
          "total-count",
        );
        calcProgress(
          "view-universe",
          "univ-progress-fill",
          "univ-progress-percentage",
          "univ-progress-count",
          "univ-total-count",
        );
      }

      function setGlobalCheck(viewId, isChecked) {
        document
          .querySelectorAll(`#${viewId} .category input[type="checkbox"]`)
          .forEach((cb) => {
            cb.checked = isChecked;
            const key = getStorageKey(cb);
            localStorage.setItem(key, isChecked);
            document
              .querySelectorAll(`input[type="checkbox"]`)
              .forEach((otherCb) => {
                if (getStorageKey(otherCb) === key) otherCb.checked = isChecked;
              });
          });
        updateAllProgress();
      }
      document
        .getElementById("check-all")
        .addEventListener("change", (e) =>
          setGlobalCheck("view-mcu", e.target.checked),
        );
      document
        .getElementById("univ-check-all")
        .addEventListener("change", (e) =>
          setGlobalCheck("view-universe", e.target.checked),
        );

      // Caricamento salvataggi e ascolto click
      document
        .querySelectorAll('.category input[type="checkbox"]')
        .forEach((cb) => {
          const key = getStorageKey(cb);
          if (localStorage.getItem(key) === "true") cb.checked = true;

          if (cb.classList.contains("check-phase")) {
            cb.addEventListener("click", (e) => {
              const isChecked = e.target.checked;
              e.target
                .closest(".category")
                .querySelectorAll('.movie-list input[type="checkbox"]')
                .forEach((childCb) => {
                  childCb.checked = isChecked;
                  const childKey = getStorageKey(childCb);
                  localStorage.setItem(childKey, isChecked);
                  document
                    .querySelectorAll(`input[type="checkbox"]`)
                    .forEach((o) => {
                      if (getStorageKey(o) === childKey) o.checked = isChecked;
                    });
                });
              updateAllProgress();
            });
            return;
          }

          cb.addEventListener("change", (e) => {
            const isChecked = e.target.checked;
            const syncKey = getStorageKey(e.target);

            document
              .querySelectorAll(`input[type="checkbox"]`)
              .forEach((otherCb) => {
                if (getStorageKey(otherCb) === syncKey)
                  otherCb.checked = isChecked;
              });

            const liItem = e.target.closest("li");
            if (liItem && !e.target.closest(".episodes")) {
              const episodeCbs = liItem.querySelectorAll(
                '.episodes input[type="checkbox"]',
              );
              episodeCbs.forEach((ep) => {
                const epKey = getStorageKey(ep);
                document
                  .querySelectorAll(`input[type="checkbox"]`)
                  .forEach((o) => {
                    if (getStorageKey(o) === epKey) o.checked = isChecked;
                  });
                localStorage.setItem(epKey, isChecked);
              });
            }

            localStorage.setItem(syncKey, isChecked);
            updateAllProgress();
          });
        });

      updateAllProgress();

      // 5. AUDIO BTN
      document.addEventListener("DOMContentLoaded", function () {
        const audioBtn = document.getElementById("audio-toggle-btn");
        if (audioBtn && bgMusic) {
          audioBtn.addEventListener("click", function () {
            bgMusic.muted = !bgMusic.muted;
            audioBtn.innerText = bgMusic.muted ? "🔇" : "🔊";
            audioBtn.title = bgMusic.muted ? "Attiva Audio" : "Disattiva Audio";
          });
        }
      });
    </script>
  </body>
</html>
