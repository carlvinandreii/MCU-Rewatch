<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MCU Rewatch Tracker</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        margin: 0;
        padding: 25px;
        font-size: 14px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }
      h1 {
        text-align: center;
        color: #e23636;
        text-transform: uppercase;
        font-size: 2.2em;
        margin-bottom: 30px;
      }
      .top-dashboard {
        background-color: #1e293b;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 25px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid #334155;
        text-align: center;
      }
      .progress-bar {
        background-color: #0f172a;
        border-radius: 10px;
        height: 14px;
        width: 100%;
        margin: 15px 0;
        overflow: hidden;
        border: 1px solid #334155;
      }
      .progress-fill {
        background-color: #e23636;
        height: 100%;
        width: 0%;
        transition: width 0.3s ease;
      }
      .progress-text {
        font-size: 1.1em;
        font-weight: 600;
      }
      .grid-container {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
        gap: 20px;
      }
      .category {
        background-color: #1e293b;
        border-radius: 12px;
        padding: 18px 22px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        border: 1px solid #334155;
        border-left: 5px solid #e23636;
      }
      .category-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 2px solid #e23636;
        padding-bottom: 8px;
        margin-bottom: 12px;
      }
      .category-header h2 {
        margin: 0;
        font-size: 1.25em;
        color: #f1f5f9;
      }
      .movie-list {
        list-style-type: none;
        padding: 0;
        margin: 0;
      }
      .movie-list li {
        padding: 7px 0;
        border-bottom: 1px solid rgba(51, 65, 85, 0.4);
      }
      .movie-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      label {
        font-weight: 500;
        cursor: pointer;
        display: flex;
        align-items: center;
        flex-grow: 1;
      }
      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 12px;
        cursor: pointer;
        accent-color: #e23636;
      }
      .checked-text {
        text-decoration: line-through;
        color: #64748b;
      }
      .duration {
        font-size: 0.8em;
        color: #94a3b8;
        margin-left: 10px;
      }
      details {
        margin-top: 8px;
        padding: 8px;
        background: #0f172a;
        border-radius: 6px;
        border: 1px solid #334155;
      }
      summary {
        cursor: pointer;
        font-size: 0.85em;
        color: #e23636;
        font-weight: bold;
      }
      .episodes {
        list-style: none;
        padding: 6px 0 0 15px;
      }
      .episodes li {
        padding: 3px 0;
        border-bottom: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Road to Avengers: Doomsday</h1>

      <div class="top-dashboard">
        <div class="progress-text">
          Progresso Rewatch: <span id="progress-percentage">0</span>% (<span
            id="progress-count"
            >0</span
          >
          di <span id="total-count">0</span> completati)
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="global-controls">
          <label style="cursor: pointer; font-weight: 600; color: #e23636">
            <input
              type="checkbox"
              id="check-all"
              style="
                width: 18px;
                height: 18px;
                vertical-align: middle;
                margin-right: 8px;
              "
            />
            Azzera / Seleziona Tutto
          </label>
        </div>
      </div>

      <div class="grid-container">
        <!-- FASE 1 -->
        <div class="category">
          <div class="category-header">
            <h2>Fase 1: L'Inizio</h2>
            <label><input type="checkbox" class="check-phase" /></label>
          </div>
          <ul class="movie-list">
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-1" /> Iron Man (2008)</label
                ><span class="duration">2h 6m</span>
              </div>
            </li>
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-2" /> L'Incredibile Hulk
                  (2008)</label
                ><span class="duration">1h 52m</span>
              </div>
            </li>
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-3" /> Iron Man 2
                  (2010)</label
                ><span class="duration">2h 4m</span>
              </div>
            </li>
            <li>
              <div class="movie-item">
                <label><input type="checkbox" id="movie-4" /> Thor (2011)</label
                ><span class="duration">1h 55m</span>
              </div>
            </li>
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-5" /> Captain America
                  (2011)</label
                ><span class="duration">2h 4m</span>
              </div>
            </li>
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-6" /> The Avengers
                  (2012)</label
                ><span class="duration">2h 23m</span>
              </div>
            </li>
          </ul>
        </div>

        <!-- FASE 4 -->
        <div class="category">
          <div class="category-header">
            <h2>Fase 4: Il Multiverso</h2>
            <label><input type="checkbox" class="check-phase" /></label>
          </div>
          <ul class="movie-list">
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-30" /> WandaVision
                  (Serie)</label
                >
              </div>
              <details>
                <summary>Visualizza Episodi (9)</summary>
                <ul class="episodes">
                  <li>
                    <label><input type="checkbox" id="wv1" /> Episodio 1</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv2" /> Episodio 2</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv3" /> Episodio 3</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv4" /> Episodio 4</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv5" /> Episodio 5</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv6" /> Episodio 6</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv7" /> Episodio 7</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv8" /> Episodio 8</label>
                  </li>
                  <li>
                    <label><input type="checkbox" id="wv9" /> Episodio 9</label>
                  </li>
                </ul>
              </details>
            </li>
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-31" /> Loki - Stagione
                  1</label
                >
              </div>
              <details>
                <summary>Visualizza Episodi (6)</summary>
                <ul class="episodes">
                  <li>
                    <label
                      ><input type="checkbox" id="l1-1" /> Episodio 1</label
                    >
                  </li>
                  <li>
                    <label
                      ><input type="checkbox" id="l1-2" /> Episodio 2</label
                    >
                  </li>
                  <li>
                    <label
                      ><input type="checkbox" id="l1-3" /> Episodio 3</label
                    >
                  </li>
                  <li>
                    <label
                      ><input type="checkbox" id="l1-4" /> Episodio 4</label
                    >
                  </li>
                  <li>
                    <label
                      ><input type="checkbox" id="l1-5" /> Episodio 5</label
                    >
                  </li>
                  <li>
                    <label
                      ><input type="checkbox" id="l1-6" /> Episodio 6</label
                    >
                  </li>
                </ul>
              </details>
            </li>
            <li>
              <div class="movie-item">
                <label
                  ><input type="checkbox" id="movie-32" /> Black Widow
                  (2021)</label
                ><span class="duration">2h 14m</span>
              </div>
            </li>
          </ul>
        </div>
      </div>
    </div>

    <script>
      const allCheckboxes = document.querySelectorAll(
        '.movie-list input[type="checkbox"]',
      );
      const phaseCheckboxes = document.querySelectorAll(".check-phase");
      const globalCheckbox = document.getElementById("check-all");

      const progressFill = document.getElementById("progress-fill");
      const progressText = document.getElementById("progress-percentage");
      const progressCount = document.getElementById("progress-count");
      const totalCount = document.getElementById("total-count");

      function updateProgress() {
        let checkedCount = 0;
        allCheckboxes.forEach((checkbox) => {
          const parentLabel = checkbox.closest("label");
          if (checkbox.checked) {
            checkedCount++;
            if (parentLabel) parentLabel.classList.add("checked-text");
          } else {
            if (parentLabel) parentLabel.classList.remove("checked-text");
          }
        });

        const totalItems = allCheckboxes.length;
        const percentage =
          totalItems === 0 ? 0 : Math.round((checkedCount / totalItems) * 100);

        progressFill.style.width = percentage + "%";
        progressText.innerText = percentage;
        progressCount.innerText = checkedCount;
        totalCount.innerText = totalItems;

        // Sincronizzazione Serie -> Episodi
        document.querySelectorAll(".category li").forEach((liItem) => {
          const seriesCb = liItem.querySelector(
            ':scope > .movie-item input[type="checkbox"]',
          );
          const episodeCbs = liItem.querySelectorAll(
            '.episodes input[type="checkbox"]',
          );

          if (seriesCb && episodeCbs.length > 0) {
            const allEpChecked = Array.from(episodeCbs).every(
              (cb) => cb.checked,
            );
            seriesCb.checked = allEpChecked;
            const seriesLabel = seriesCb.closest("label");
            if (seriesLabel) {
              if (allEpChecked) seriesLabel.classList.add("checked-text");
              else seriesLabel.classList.remove("checked-text");
            }
          }
        });

        // Sincronizzazione Fasi
        document.querySelectorAll(".category").forEach((categoryDiv) => {
          const phaseCb = categoryDiv.querySelector(".check-phase");
          if (!phaseCb) return;

          const itemsInPhase = categoryDiv.querySelectorAll(
            '.movie-list > li > .movie-item input[type="checkbox"], .movie-list > li > label > input[type="checkbox"]',
          );
          if (itemsInPhase.length === 0) return;

          const allPhaseChecked = Array.from(itemsInPhase).every(
            (cb) => cb.checked,
          );
          phaseCb.checked = allPhaseChecked;
        });

        // Master Seleziona Tutto
        if (globalCheckbox) {
          globalCheckbox.checked =
            totalItems > 0 &&
            Array.from(allCheckboxes).every((cb) => cb.checked);
        }
      }

      allCheckboxes.forEach((checkbox) => {
        const savedState = localStorage.getItem(checkbox.id);
        if (savedState === "true") {
          checkbox.checked = true;
        }

        checkbox.addEventListener("change", () => {
          const liItem = checkbox.closest("li");
          if (liItem) {
            const seriesCb = liItem.querySelector(
              ':scope > .movie-item input[type="checkbox"]',
            );
            const episodeCbs = liItem.querySelectorAll(
              '.episodes input[type="checkbox"]',
            );
            if (checkbox === seriesCb && episodeCbs.length > 0) {
              episodeCbs.forEach((ep) => {
                ep.checked = seriesCb.checked;
                localStorage.setItem(ep.id, seriesCb.checked);
              });
            }
          }

          localStorage.setItem(checkbox.id, checkbox.checked);
          updateProgress();
        });
      });

      if (globalCheckbox) {
        globalCheckbox.addEventListener("change", (e) => {
          const isChecked = e.target.checked;
          allCheckboxes.forEach((cb) => {
            cb.checked = isChecked;
            localStorage.setItem(cb.id, isChecked);
          });
          phaseCheckboxes.forEach((pcb) => (pcb.checked = isChecked));
          updateProgress();
        });
      }

      phaseCheckboxes.forEach((phaseCb) => {
        phaseCb.addEventListener("change", (e) => {
          const isChecked = e.target.checked;
          const categoryDiv = e.target.closest(".category");
          const itemsInPhase = categoryDiv.querySelectorAll(
            '.movie-list input[type="checkbox"]',
          );

          itemsInPhase.forEach((cb) => {
            cb.checked = isChecked;
            localStorage.setItem(cb.id, isChecked);
          });
          updateProgress();
        });
      });

      updateProgress();
    </script>
  </body>
</html>
